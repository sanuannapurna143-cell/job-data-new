name: Job Scraper Automation

on:
  schedule:
    # ଏହା ଦିନକୁ ୪ ଥର ଚାଲିବ
    - cron: '30 2,7,12,16 * * *'
  workflow_dispatch:

concurrency:
  group: scraper-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install cloudscraper beautifulsoup4

    - name: Run Job Scraper (scraper.py)
      run: python scraper.py

    - name: Run Fast Scraper (fast_scraper.py)
      run: python fast_scraper.py

    - name: Run Odisha Official Scraper
      run: python odisha_official.py
      continue-on-error: true

    - name: Commit and push changes safely
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.json
        
        if git diff-index --quiet HEAD --; then
          echo "କୌଣସି ନୂଆ ଡାଟା ନାହିଁ।"
        else
          git commit -m "Auto-update job data and results [$(date)]"
          git push
        fi
