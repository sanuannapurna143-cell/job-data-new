name: Job Scraper Automation

on:
  schedule:
    - cron: '30 2,7,12,16 * * *'
  workflow_dispatch:

# ଏହା ରୋବଟ୍ କୁ କ୍ରାସ୍ ହେବାରୁ ବଞ୍ଚାଇବ
concurrency:
  group: scraper-group
  cancel-in-progress: false

# ଏହା ରୋବଟ୍ କୁ ସେଭ୍ କରିବାର କ୍ଷମତା ଦେବ
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install cloudscraper beautifulsoup4

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and push changes safely
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        
        # ଯଦି ନୂଆ ଡାଟା ଅଛି, ତେବେ ହିଁ ସେଭ୍ କର (ଏହା ଏରର୍ ଆସିବାକୁ ଦେବନି)
        if git diff-index --quiet HEAD --; then
          echo "କୌଣସି ନୂଆ ଡାଟା ନାହିଁ, ସେଭ୍ କରିବାର ଆବଶ୍ୟକତା ନାହିଁ।"
        else
          git commit -m "Auto-update job data"
          git push
        fi
